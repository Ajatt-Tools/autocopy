name: CI

on:
  # Branch pushes and pull requests run these checks. Release tags have a separate workflow.
  push:
    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onpushbranchestagsbranches-ignoretags-ignore
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Qt and other dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9
        with:
          packages: libegl1 libopengl0 libxkbcommon0 atool
          version: 1.0

      - name: Install Hatch
        run: pip install hatch

      # Same format/lint split as the other migrated AJT add-ons.
      # https://github.com/Ajatt-Tools/learn-now-button/blob/bc9723e73666bbf48ecf4c4d51c624359989f8db/pyproject.toml#L116-L142
      - name: Check formatting
        run: hatch check fmt

      - name: Lint
        run: hatch check code

      - name: Run tests
        run: hatch test -v
