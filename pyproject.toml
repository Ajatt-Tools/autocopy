[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling>=1.24",
    "hatch-vcs>=0.4",
]

[project]
name = "autocopy"
dynamic = ["version"]
description = 'Automatically copy configured Anki fields to the clipboard.'
readme = "README.md"
requires-python = "~=3.10" # anki officially only runs on 3.10
license = { file = "LICENSE" }
keywords = ["ajatt"]
authors = [
    { name = "Ajatt-Tools and contributors" },
    { name = "Ren Tatsumoto", email = "tatsu@autistici.org" },
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/Ajatt-Tools/autocopy"
Issues = "https://github.com/Ajatt-Tools/autocopy/issues"
Source = "https://github.com/Ajatt-Tools/autocopy"

# Tools

[tool.hatch.version]
source = "vcs"
path = "autocopy/__about__.py"

[tool.hatch.build.hooks.vcs]
version-file = "autocopy/__about__.py"

[tool.hatch.envs.dev]
dependencies = [
    "mypy>=1.0.0",
    "pytest",
    "aqt>=26.9",
    "beartype",
]
python = "3.10"
system-packages = true

[[tool.hatch.envs.dev.matrix]]
# https://hatch.pypa.io/latest/tutorials/testing/overview/#testing-projects
python = ["3.10", ]

[tool.hatch.envs.dev.scripts]
# run as `hatch run dev:scriptname`
check = "mypy --install-types --non-interactive {args:autocopy tests}"
package = "$(git rev-parse --show-toplevel)/scripts/package.sh"

[tool.coverage.run]
source_pkgs = ["autocopy", "playground", "tests"]
branch = true
parallel = true
omit = [
    "autocopy/__about__.py",
]

[tool.coverage.paths]
autocopy = ["autocopy", "*/autocopy/autocopy"]
playground = ["playground", "*/autocopy/playground"]
tests = ["tests", "*/autocopy/tests"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 120
target-version = ['py310']
unstable = true

[tool.isort]
profile = "black"

[tool.basedpyright]
reportUnusedCallResult = false

[tool.pytest.ini_options]
# Only collect tests from the tests/ directory, not from source files.
testpaths = ["tests"]

# https://hatch.pypa.io/latest/config/internal/testing/
# https://hatch.pypa.io/latest/tutorials/testing/overview/
[tool.hatch.envs.hatch-test]
dependencies = [
    "coverage[toml]", # hatch test --cover invokes the coverage executable.
    "mypy>=1.0.0",
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
    "aqt>=26.9", # needed to run Anki addon tests
    "beartype",
]
system-packages = true
parallel = true
randomize = true

# https://hatch.pypa.io/latest/tutorials/testing/overview/#testing-projects
# NOTE: Anki is still stuck on python 3.10. Ensure the add-on works on Python 3.10.
[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.10", ]

# Adapted from Card Management's separate formatter and linter environments.
# https://github.com/Ajatt-Tools/learn-now-button/blob/bc9723e73666bbf48ecf4c4d51c624359989f8db/pyproject.toml#L116-L142
# https://hatch.pypa.io/latest/how-to/static-analysis/behavior/
[tool.hatch.envs.hatch-check-fmt]
# pyupgrade>=3.22 needs Python 3.11+. Keep the tool runtime separate from Anki's compatibility target.
python = "3.14"
dependencies = [
    "black>=26.10",
    "isort>=9.0",
    "pyupgrade>=3.22",
]

# https://hatch.pypa.io/latest/config/internal/static-analysis/#scripts
[tool.hatch.envs.hatch-check-fmt.scripts]
format-check = [
    "bash \"$(git rev-parse --show-toplevel)/scripts/format.sh\" --check",
]
format-fix = [
    # run as: hatch check fmt --fix
    "bash \"$(git rev-parse --show-toplevel)/scripts/format.sh\" ",
]

[tool.hatch.envs.hatch-check-code]
dependencies = ["flake8"]

[tool.hatch.envs.hatch-check-code.scripts]
# Keep lint exceptions in .flake8, not in CI or command-line options.
lint-check = "flake8 {args:autocopy playground tests}"
lint-fix = "lint-check"
